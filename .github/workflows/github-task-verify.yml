name: github-task-verify

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Work branch to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: repository tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out the approved work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and run the repository test suite
        shell: bash
        run: |
          set -o pipefail
          {
            python -m compileall -q core engines templates vajrastra.py tests
            python -m unittest discover -s tests -v
          } 2>&1 | tee verification.log

      - name: Upload test and compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-task-verification-py${{ matrix.python-version }}
          path: verification.log
          if-no-files-found: warn
          retention-days: 14
