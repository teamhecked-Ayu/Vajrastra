name: watchdog

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile the package
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q core engines templates vajrastra.py tests 2>&1 | tee -a verification.log

      - name: Verify the sealed core
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee -a verification.log
          import sys
          from pathlib import Path

          from core.security_guard import SecurityGuard

          report = SecurityGuard(Path(".")).verify()
          print(report.describe())
          print(f"bundle: {report.bundle_sha256}")
          print(f"sealed: {report.sealed_at}")
          for path in report.unexpected:
              print(f"unexpected core file: {path}")
          if report.status != "verified" or report.unexpected:
              print("integrity check failed: re-seal core/security_lock.json deliberately if this was intended")
              sys.exit(1)
          PY

      - name: Run the unit test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee -a verification.log
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Smoke-run the CLI without optional engines
        shell: bash
        run: |
          set -o pipefail
          {
            python vajrastra.py --help
            python vajrastra.py --root "$RUNNER_TEMP/wd" memory stats
            # The research gate may legitimately return non-zero when it is not significant.
            python vajrastra.py --root "$RUNNER_TEMP/wd" research "watchdog smoke" --seeds 3 --budget 1 \
              || echo "research gate returned non-zero (expected when the gate is not significant)"
            python vajrastra.py --root "$RUNNER_TEMP/wd" worker --once || true
          } 2>&1 | tee -a verification.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-verification-py${{ matrix.python-version }}
          path: verification.log
          if-no-files-found: warn
          retention-days: 14
