name: watchdog

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile tree
        run: python -m compileall vajrastra.py core engines tests

      - name: Integrity gate (fails on changed/missing/unexpected protected files)
        run: python -m core._guard_integrity check --root .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Core smoke import
        run: python -c "import core.security_guard, core.agent_loop, core.memory_engine; print('core imports OK')"
